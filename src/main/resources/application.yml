spring:
  application:
    name: malhaia-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:malhaia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  tomcat:
    max-http-form-post-size: 262144
    max-swallow-size: 262144

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

malhaia:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-at-least-256-bits-long-for-hs256!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  security:
    trust-proxy: ${TRUST_PROXY:false}
  abacus:
    api-key: ${ABACUS_API_KEY:${ABACUSAI_API_KEY:}}
    base-url: ${ABACUS_BASE_URL:https://routellm.abacus.ai/v1}
    model-name: ${ABACUS_MODEL_NAME:${LLM_MODEL:claude-sonnet-5}}
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:${EMBEDDING_MODEL:gemini-embedding-001}}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
