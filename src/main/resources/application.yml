spring:
  application:
    name: malhaia-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:malhaia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

malhaia:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-secret-at-least-256-bits-long-for-hs256!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  abacus:
    # Aceita ABACUS_API_KEY ou ABACUSAI_API_KEY (alias comum)
    api-key: ${ABACUS_API_KEY:${ABACUSAI_API_KEY:}}
    base-url: ${ABACUS_BASE_URL:https://routellm.abacus.ai/v1}
    # ID RouteLLM: claude-sonnet-5
    model-name: ${ABACUS_MODEL_NAME:claude-sonnet-5}
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:${EMBEDDING_MODEL:gemini-embedding-001}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
